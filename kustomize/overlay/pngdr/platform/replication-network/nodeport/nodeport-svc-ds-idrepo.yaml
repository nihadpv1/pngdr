apiVersion: v1
kind: Service
metadata:
  name: ds-idrepo-external
  namespace: pngdr

spec:
  type: NodePort

  selector:
    app: ds-idrepo

  ports:

    - name: repl
      port: 8989
      targetPort: 8989
      nodePort: 30989

    - name: admin
      port: 4444
      targetPort: 4444
      nodePort: 30444       
